# CI of this plugin: the SDK's reusable workflow (npm ci → Playwright WebKit → gitleaks →
# npm run verify:full). Only `pull_request` (never pull_request_target): a PR runs without secrets.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    uses: tilr-dev/plugin-sdk/.github/workflows/plugin.yml@v0
