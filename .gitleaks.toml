# gitleaks: the default rules, plus what is known not to be a secret here.
[extend]
useDefault = true

[[allowlists]]
# tools/bench.test.mjs is gone (moved out of the SDK), but verify and CI scan the whole history.
description = "bench metric keys (typing.keyToPaint.p95) in the history's tools/bench.test.mjs match generic-api-key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tools/bench\.test\.mjs$''']
regexTarget = "match"
regexes = ['''typing\.[A-Za-z]+\.p\d+''']

[[allowlists]]
description = "site/ is the core page built from web and copied by npm run sync:runtime (bundles, vendored React and cordis, source maps): not this repo's source"
paths = ['''^site/''']
