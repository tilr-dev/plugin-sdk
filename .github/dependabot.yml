version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # oxlint-tsgolint is built on one TypeScript release: the three move together.
      typescript-oxlint:
        patterns:
          - 'typescript'
          - 'oxlint'
          - 'oxlint-tsgolint'
      npm:
        patterns:
          - '*'
        exclude-patterns:
          - 'typescript'
          - 'oxlint'
          - 'oxlint-tsgolint'
  # Actions are pinned by commit SHA; Dependabot moves the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
