# The SDK's CI: `npm run verify:full` on every PR and every push to master (repo standard, §9).
# Only `pull_request` (never pull_request_target): a PR's code runs without secrets.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:full (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      # The core repo (web/): api:check compares api/ with what its sources emit, and site/ (the
      # built core page the unit tests, the harness and the tarball need) is built from it.
      # TODO: confirm the repository name; a private one needs a read-only token here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tilr-dev/web
          path: web
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            web/package-lock.json
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: sdk
      - name: Core page (site/) from web
        run: npm run sync:runtime -- --build
        working-directory: sdk
        env:
          TILR_WEB_DIR: ../web
      - run: npm run verify:full
        working-directory: sdk
        env:
          TILR_WEB_DIR: ../web
