# Releases (repo standard, §5): release-please keeps a release PR open from the Conventional
# Commits on main (version bump + CHANGELOG); merging it tags vX.Y.Z and creates the GitHub
# release, and `publish` then publishes that tag to npm.
#
# The release-please job acts as the org GitHub App tilr-bot (a short-lived installation token
# from actions/create-github-app-token, scoped to this repository): the release PR is opened by
# tilr-bot, not by the GITHUB_TOKEN, so CI runs on it like on any PR. There is no bypass: the
# release PR goes through the same required checks, and merging it is the release approval.
#
# publish: npm trusted publishing (OIDC, no NPM_TOKEN) with provenance. npm's trusted publisher
# for @tilr-dev/plugin is bound to this repository, this file (release.yml) and the `npm`
# environment. That environment is restricted to `main` and has no required reviewer: the
# merged release PR is the gate. It needs no web checkout: site/ (the core page) is committed,
# and `api` (api:check, web's sources) is skipped as in ci.yml. It runs in this workflow, gated
# on release-please's `release_created`, rather than on `release: published`, so the trusted
# publisher stays bound to release.yml.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: read # all writes go through the tilr-bot token below
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TILR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TILR_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # the release PR's branch, the tag, the GitHub release
          permission-pull-requests: write # the release PR
          permission-issues: write # release-please's labels on the release PR
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # npm >= 11.5 for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - run: npm ci
      # As in ci.yml: api:check needs web's sources; everything else (pack included) runs.
      - run: npm run verify -- --full --skip api
      - run: npm publish --provenance --access public
