# Releases (repo standard, §5): release-please keeps a release PR open from the Conventional
# Commits on master (version bump + CHANGELOG); merging it tags vX.Y.Z and creates the GitHub
# release.
#
# Publishing to npm is manual for now (README, Releasing): the package ships site/, the core page
# built from tilr-dev/web, which is not on GitHub yet. TODO: when it is, add the publish job back
# (see publish.yml) and run it when release-please created a release.
name: release

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release PR's branch, the tag, the GitHub release
      pull-requests: write # the release PR
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
